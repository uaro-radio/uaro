# Сайт збирається тут, а не на сервері: там одне ядро й 1,9 ГБ пам'яті на
# два сайти. Готовий build/ іде одним комітом у гілку deploy, а сервер
# забирає її й нічого не збирає (~/bin/prebuilt-deploy.sh, див. README).
name: Збірка для деплою

on:
  push:
    branches: [main]
  workflow_dispatch:

# Писати потрібно лише в гілку deploy.
permissions:
  contents: write

# Новіший коміт робить попередню збірку тієї самої гілки непотрібною. Група —
# своя для кожної гілки: перевірка на гілці не має скасувати збірку з main.
concurrency:
  group: deploy-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Остання LTS; Docusaurus 3.10 просить лише >= 20.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # node_modules цілком, без кешу збірки всередині: розпакувати його
      # швидше, ніж npm ci з кешем npm. npm ci — лише коли змінився package-lock.
      - id: modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            !node_modules/.cache
          key: modules-node26-${{ hashFiles('package-lock.json') }}

      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      # Кеш Rspack лежить у node_modules/.cache, а npm ci стирає node_modules,
      # тому відновлюємо його після встановлення. Застарілим він не стає —
      # Rspack перевіряє його сам. Обидві мови збираються паралельно
      # (tools/build.js), кеш у кожної свій. Префікс ключа інший, ніж за
      # webpack: інакше кеш webpack відновлювався б і зберігався разом із
      # кешем Rspack без кінця, хоч його ніхто вже не читає.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache
          key: rspack-node26-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            rspack-node26-${{ hashFiles('package-lock.json') }}-
            rspack-node26-

      # Мови паралельно, кожна своїм процесом (tools/build.js). Локальний
      # `npm run build` лишається звичайним.
      - run: npm run build:prod

      # Щоразу новий корінь і force-push: історія гілки не росте, у ній завжди
      # один коміт. Сирцевий коміт — у повідомленні, сервер пише його в лог.
      # Лише з main: запуск на іншій гілці (вручну, для перевірки) збирає,
      # але живий сайт не чіпає.
      - name: Покласти build/ у гілку deploy
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build
          git init -q -b deploy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Попередня збірка — точка відліку: тоді push відправляє лише змінені
          # файли, а не всю збірку. Новий коміт однаково без батька.
          git fetch -q --depth=1 origin deploy || true
          git add -A
          git commit -q -m "build ${GITHUB_SHA}"
          git push -q -f origin deploy
