# Сайт збирається тут, а не на сервері: там одне ядро й 1,9 ГБ пам'яті на
# два сайти. Готовий build/ іде одним комітом у гілку deploy, а сервер
# забирає її й нічого не збирає (~/bin/prebuilt-deploy.sh, див. README).
name: Збірка для деплою

on:
  push:
    branches: [main]
  workflow_dispatch:

# Писати потрібно лише в гілку deploy.
permissions:
  contents: write

# Новіший коміт робить попередню збірку тієї самої гілки непотрібною. Група —
# своя для кожної гілки: перевірка на гілці не має скасувати збірку з main.
concurrency:
  group: deploy-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Остання LTS; Docusaurus 3.10 просить лише >= 20.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Кеш webpack лежить у node_modules/.cache, а npm ci стирає node_modules,
      # тому відновлюємо його після встановлення.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache
          key: webpack-node26-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            webpack-node26-${{ hashFiles('package-lock.json') }}-
            webpack-node26-

      - run: npm run build

      # Щоразу новий корінь і force-push: історія гілки не росте, у ній завжди
      # один коміт. Сирцевий коміт — у повідомленні, сервер пише його в лог.
      # Лише з main: запуск на іншій гілці (вручну, для перевірки) збирає,
      # але живий сайт не чіпає.
      - name: Покласти build/ у гілку deploy
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build
          git init -q -b deploy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "build ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
